name: Synapsis Quality & Integrity CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies & Playwright Chromium
      run: |
        python -m pip install --upgrade pip
        pip install jsonschema playwright
        python -m playwright install --with-deps chromium

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Synapsis 13-Suite Automated Test Suite
      run: |
        python validate_synapsis.py

    - name: Run Playwright Browser UI & DOM Integration Tests
      run: |
        python test_browser_ui.py
